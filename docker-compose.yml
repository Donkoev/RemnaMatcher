services:
  remnamatcher:
    build: .
    image: ghcr.io/donkoev/remnamatcher:latest
    container_name: remnamatcher
    restart: unless-stopped
    env_file: server/.env
    ports:
      # только localhost: наружу выпускать через reverse-proxy или SSH-туннель.
      # Порт берётся из .env в корне проекта (PORT=…), его пишет установщик — файл compose не правится
      - '127.0.0.1:${PORT:-3300}:${PORT:-3300}'
    volumes:
      - ./server/data:/app/server/data
